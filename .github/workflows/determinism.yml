name: Determinism

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

# The simulation is integer-only, so the same command stream must produce the same state hash on
# every platform we ship to. This is the gate that proves it. A failure here blocks the merge,
# whatever else the change fixes.
jobs:
  replay-matrix:
    name: Replay corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Brinehold.sln -c Release --nologo

      - name: Verify the golden replay corpus
        run: dotnet run -c Release --no-build --project src/Brinehold.Tools.ReplayCheck -- --dir tests/replays

      - name: Determinism unit tests
        run: dotnet test src/Brinehold.Sim.Tests/Brinehold.Sim.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~DeterminismTests"

      - name: Golden replay tests
        run: dotnet test src/Brinehold.Integration.Tests/Brinehold.Integration.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~GoldenReplayTests"

      # macOS runners are arm64, so this leg also covers the cross-architecture case: the same
      # replay must reproduce on a different CPU family, not merely a different operating system.
      - name: Report the platform that ran
        run: dotnet --info | head -20
        shell: bash
